<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Banco de Hermandad - WotLK 3.3.5a</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>const whTooltips={colorLinks:false,iconizeLinks:false,renameLinks:false,hide:{sellprice:true}};</script>
<script src="https://wow.zamimg.com/js/tooltips.js" defer></script>
<style>
:root{--wow-bg:#0c0e12}
body{background-color:var(--wow-bg);background-image:radial-gradient(circle at 50% 0%,rgba(30,58,95,.25) 0%,transparent 60%),radial-gradient(circle at 50% 100%,rgba(120,82,25,.15) 0%,transparent 60%);color:#e2e8f0;font-family:'Inter',sans-serif;min-height:100vh}
.font-wow{font-family:'Cinzel',serif}
.q-0{border-color:#9d9d9d;color:#9d9d9d}.q-1{border-color:#fff;color:#fff}.q-2{border-color:#1eff00;color:#1eff00}.q-3{border-color:#0070dd;color:#0070dd}.q-4{border-color:#a335ee;color:#a335ee}.q-5{border-color:#ff8000;color:#ff8000}.q-6,.q-7{border-color:#e6cc80;color:#e6cc80}
.wow-slot{background:linear-gradient(145deg,#12151c 0%,#07090c 100%);box-shadow:inset 0 0 8px rgba(0,0,0,.9),0 2px 4px rgba(0,0,0,.5);contain:content}
.wow-slot:hover{box-shadow:inset 0 0 6px rgba(255,209,0,.25),0 0 14px rgba(255,209,0,.35);z-index:20}
.wow-icon-frame{position:relative;width:44px;height:44px;border-radius:6px;border-width:2px;overflow:hidden;flex-shrink:0;background-color:#050608;box-shadow:inset 0 0 6px #000}
.wow-icon-frame img{width:100%;height:100%;object-fit:cover}
.stack-badge{position:absolute;bottom:0;right:2px;font-weight:800;font-size:11px;line-height:1;color:#fff;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 1px 2px #000;pointer-events:none}
.coord-badge{position:absolute;top:-1px;left:1px;font-size:14px;font-weight:700;color:rgba(255,209,0,.85);text-shadow:-1px 0 black,1px 0 black,0 -1px black,0 1px black;pointer-events:none}
.grid-cols-14{grid-template-columns:repeat(14,minmax(0,1fr))}
.mode-ingame .bank-grid{display:grid;grid-template-columns:repeat(14,48px);width:max-content;min-width:0!important;margin:0 auto;gap:4px;background:transparent}
.mode-ingame .wow-slot{justify-content:center;align-items:center;aspect-ratio:1/1;padding:1px}
.mode-ingame .item-details,.hide-stack .stack-badge,.hide-coords .coord-badge{display:none!important}
.mode-ingame .wow-icon-frame{width:44px;height:44px;border-width:1px}
.mode-bot .bank-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))!important;width:100%!important;min-width:0!important;gap:8px}
.mode-bot .wow-slot{flex-direction:column!important;align-items:center!important;text-align:center!important;padding:10px!important}
.mode-bot .wow-icon-frame{width:56px!important;height:56px!important;margin-bottom:4px}
.mode-bot .item-details{width:100%}
.slot-dimmed{opacity:.18;filter:grayscale(85%)}
.tab-btn{transition:all .15s ease}
.tab-btn .tab-icon{transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}
.tab-btn:hover .tab-icon{transform:scale(1.06);border-color:rgba(255,209,0,.65)}
.tab-btn.active{background:linear-gradient(180deg,#2a2317 0%,#18140d 100%);border-color:#ffd100;color:#ffd100;box-shadow:0 0 14px rgba(255,209,0,.22)}
.tab-btn.active .tab-icon{border-color:#ffd100;box-shadow:0 0 12px rgba(255,209,0,.45),0 4px 8px rgba(0,0,0,.8)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#0c0e12}::-webkit-scrollbar-thumb{background:#3d3322;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#69573a}
</style>
</head>
<body class="p-3 md:p-6">
<div class="max-w-[1440px] mx-auto">
<header class="bg-[#151921]/95 border border-[#4a3d28] rounded-xl p-4 md:p-6 mb-5 shadow-2xl">
<div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-[#2c3342] pb-4 min-h-[58px]">
<div>
<h1 id="main-title" class="font-wow text-2xl md:text-3xl font-bold text-[#ffd100] mt-2 tracking-wide">Banco de Hermandad</h1>
<span class="px-2.5 py-0.5 text-xs font-bold tracking-wider bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded">WotLK 3.3.5a</span>
</div>
<div id="export-container" class="hidden flex-wrap items-center gap-2.5">
<button type="button" id="btn-export" class="flex items-center gap-2 px-4 py-2.5 bg-gradient-to-b from-amber-600 to-amber-700 hover:from-amber-500 hover:to-amber-600 text-white font-semibold text-sm rounded-lg border border-amber-400/50 shadow-lg cursor-pointer">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
exportar csv al portapapeles
</button>
</div>
</div>
<nav id="tabs-container" class="flex flex-wrap items-center gap-3.5 pt-5 pb-3.5 border-b border-[#2c3342]"></nav>
<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 pt-4">
<div class="bg-[#0d1015] p-3 rounded-lg border border-slate-800">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">1. Modo de Visualización</label>
<div class="grid grid-cols-3 gap-1.5" id="view-modes">
<button type="button" data-mode="ingame" class="view-btn px-2 py-1.5 text-xs font-semibold rounded bg-amber-500 text-slate-950 hover:bg-amber-400 cursor-pointer">Compacto</button>
<button type="button" data-mode="compact" class="view-btn px-2 py-1.5 text-xs font-semibold rounded bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white cursor-pointer">Detallado</button>
<button type="button" data-mode="bot" class="view-btn px-2 py-1.5 text-xs font-semibold rounded bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white cursor-pointer">Debugging</button>
</div>
</div>
<div class="bg-[#0d1015] p-3 rounded-lg border border-slate-800">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">2. Etiquetas en Casilla</label>
<div class="flex flex-wrap gap-3 items-center h-8">
<label class="inline-flex items-center gap-2 text-xs font-medium text-slate-200 cursor-pointer select-none">
<input type="checkbox" id="toggle-stack" checked class="w-4 h-4 rounded accent-amber-500 cursor-pointer">
<span>Max Stack</span>
</label>
<label class="inline-flex items-center gap-2 text-xs font-medium text-slate-200 cursor-pointer select-none">
<input type="checkbox" id="toggle-coords" class="w-4 h-4 rounded accent-amber-500 cursor-pointer">
<span>Coords</span>
</label>
</div>
</div>
<div class="bg-[#0d1015] p-3 rounded-lg border border-slate-800">
<label for="prof-filter" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">3. Resaltar por Etiqueta</label>
<select id="prof-filter" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs font-medium rounded-md px-2.5 py-1.5 focus:outline-none focus:border-amber-500 cursor-pointer"></select>
</div>
<div class="bg-[#0d1015] p-3 rounded-lg border border-slate-800">
<label for="search-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">4. Buscar Item o ItemID</label>
<div class="relative">
<input type="text" id="search-input" placeholder="Ej: Saronita, Pellejo, 36913..." class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-md pl-3 pr-8 py-1.5 focus:outline-none focus:border-amber-500">
<button type="button" id="btn-clear" title="Limpiar búsqueda" class="absolute right-2 top-1.5 text-slate-400 hover:text-white text-xs font-bold cursor-pointer">✕</button>
</div>
</div>
</div>
</header>
<main id="bank-container" class="mode-ingame hide-coords bg-[#12161f]/90 border-2 border-[#4a3d28] rounded-xl p-2.5 md:p-4 shadow-2xl overflow-x-auto">
<div id="bank-grid" class="bank-grid grid grid-cols-14 gap-1.5 min-w-[1780px]"></div>
</main>
</div>
<div id="toast" class="hidden fixed bottom-5 right-5 bg-emerald-900/95 border border-emerald-400 text-emerald-100 px-4 py-3 rounded-lg shadow-2xl text-sm font-medium z-50 flex items-center gap-2.5 pointer-events-none">
<svg class="w-5 h-5 text-emerald-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
<span id="toast-msg">Copiado al portapapeles</span>
</div>
<script>
const Q={0:"Pobre",1:"Común",2:"Poco común",3:"Raro",4:"Épico",5:"Legendario",6:"Artefacto",7:"Reliquia"},
$=id=>document.getElementById(id),
container=$('bank-container'),
grid=$('bank-grid'),
tabsContainer=$('tabs-container'),
mainTitle=$('main-title'),
exportBox=$('export-container'),
profFilter=$('prof-filter'),
searchInput=$('search-input'),
toast=$('toast'),
toastMsg=$('toast-msg');

let bancoData=[],currentTab=null,currentMode='ingame',slotNodes=[],toastTimer;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

async function init(){
  try{
    const res=await fetch('./banco-hermandad-wow-335a.json');
    if(!res.ok)throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    bancoData=data.pestanas||[];
    if(bancoData.length>0){renderTabs();selectTab(bancoData[0].id);}
  }catch(err){
    grid.innerHTML=`<div class="col-span-14 text-center py-10 text-red-400 text-sm">Error al cargar <b>banco-hermandad-wow-335a.json</b>. Asegúrate de abrir el HTML mediante un servidor local.<br><span class="text-xs text-slate-400">${err.message}</span></div>`;
  }
}

function renderTabs(){
  tabsContainer.innerHTML=bancoData.map(tab=>`
    <button type="button" data-tab-id="${tab.id}" class="tab-btn group relative flex items-center gap-3 pl-2 pr-4 py-2 rounded-lg border border-slate-700/80 bg-[#0d1015] text-slate-300 hover:text-white hover:border-amber-500/50 text-xs sm:text-sm font-bold tracking-wide cursor-pointer">
      <div class="tab-icon relative -ml-3 -my-3.5 w-12 h-12 rounded-lg border-2 border-slate-600 bg-[#050608] overflow-hidden shrink-0 shadow-[0_4px_10px_rgba(0,0,0,0.85)]">
        <img src="https://wow.zamimg.com/images/wow/icons/large/${tab.icono}.jpg" alt="${tab.nombre}" class="w-full h-full object-cover" onerror="this.onerror=null;this.src='https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg'">
      </div>
      <span>${tab.nombre}</span>
    </button>
  `).join('');
}

function selectTab(tabId){
  const tab=bancoData.find(t=>t.id===tabId);
  if(!tab)return;
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.tabId===tabId));
  mainTitle.textContent=`Banco de Hermandad: ${tab.nombre}`;
  renderProfOptions(tab);
  renderBank(tab);
  setViewMode(currentMode);
  applyFilters();
}

function renderProfOptions(tab){
  const textos=tab.textoEtiquetas||{},etiquetas=tab.etiquetas||[];
  let optionsHtml=`<option value="ALL">${textos.ALL||'Todas las etiquetas'}</option>`;
  for(const tag of etiquetas)optionsHtml+=`<option value="${tag}">${textos[tag]||tag}</option>`;
  profFilter.innerHTML=optionsHtml;
}

function renderBank(tab){
  grid.innerHTML='';
  const etiquetas=tab.etiquetas||[],frag=document.createDocumentFragment();
  slotNodes=(tab.lista||[]).map(([r,c,id,name,icon,stack,q,profs])=>{
    const quality=q??0,qualityName=Q[quality]||"Común",itemId=id??'',
    profData=(profs||[]).map(i=>({id:i,name:etiquetas[i]||`Tag ${i}`}));
    const a=document.createElement('a');
    if(id){
      a.href=`https://www.wowhead.com/wotlk/es/item=${id}`;
      a.target='_blank';a.rel='noopener noreferrer';
      a.dataset.wowhead=`item=${id}&domain=es.wotlk`;
    }else{a.href='javascript:void(0)';}
    a.className='wow-slot group relative flex items-center gap-2 p-0.5 rounded-lg border border-slate-800/90 hover:border-amber-400/80 text-left no-underline';
    a.innerHTML=`
      <div class="wow-icon-frame q-${quality}">
        <img src="https://wow.zamimg.com/images/wow/icons/large/${icon}.jpg" alt="${name}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg'">
        <span class="coord-badge">[${r}:${c}]</span>
        <span class="stack-badge">${stack}</span>
      </div>
      <div class="item-details min-w-0 flex-1">
        <div class="text-[11px] font-semibold leading-tight break-words q-${quality}">${name}</div>
        <div class="bot-meta hidden mt-1.5 space-y-1">
          <div class="flex flex-col gap-0.5 text-[10px] font-mono text-amber-300/90">
            <span>ID: ${itemId||'N/A'}</span>
            <span>Quality ${quality}: <span class="q-${quality}">${qualityName}</span></span>
            <span class="text-slate-400 text-[9px] truncate" title="${icon}">Icon: ${icon}</span>
          </div>
          <div class="flex flex-wrap justify-center gap-1 mt-1">
            ${profData.map(p=>`<span class="inline-block px-1.5 py-0.5 bg-slate-800/90 text-slate-300 border border-slate-700 rounded text-[9px] leading-tight">${p.id}: ${p.name}</span>`).join('')}
          </div>
        </div>
      </div>`;
    frag.appendChild(a);
    return{el:a,profs:profData.map(p=>p.name),search:norm(`${name} ${itemId}`)};
  });
  grid.appendChild(frag);
  window.$WowheadPower?.refreshLinks?.();
}

function setViewMode(mode){
  currentMode=mode;
  document.querySelectorAll('.view-btn').forEach(b=>{
    const on=b.dataset.mode===mode;
    b.className=`view-btn px-2 py-1.5 text-xs font-semibold rounded cursor-pointer ${on?'bg-amber-500 text-slate-950 hover:bg-amber-400':'bg-slate-800 text-slate-300 hover:bg-slate-700 hover:text-white'}`;
  });
  container.classList.toggle('mode-ingame',mode==='ingame');
  container.classList.toggle('mode-bot',mode==='bot');
  const isBot=mode==='bot';
  exportBox.classList.toggle('hidden',!isBot);
  exportBox.classList.toggle('flex',isBot);
  grid.querySelectorAll('.bot-meta').forEach(el=>el.classList.toggle('hidden',!isBot));
}

function applyFilters(){
  const prof=profFilter.value,q=norm(searchInput.value.trim()),hasFilter=prof!=='ALL'||q!=='';
  for(let i=0;i<slotNodes.length;i++){
    const{el,profs,search}=slotNodes[i],
    match=(prof==='ALL'||profs.includes(prof))&&(q===''||search.includes(q));
    el.classList.toggle('slot-dimmed',!match);
    el.classList.toggle('ring-1',match&&hasFilter);
    el.classList.toggle('ring-amber-400/70',match&&hasFilter);
  }
}

function showToast(msg){
  toastMsg.textContent=msg;
  toast.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>toast.classList.add('hidden'),2500);
}

async function copyData() {
  if (!currentTab) return;
  const etiquetas = currentTab.etiquetas || [],
  csv = ['Fila y Columna,ItemID,MaxStack,Calidad,Icono,Nombre,Etiquetas',
    ...(currentTab.lista || []).map(([r, c, id, name, icon, stack, q, profs]) =>
	    `"${r}:${c}",${id ?? ''},${stack},"${q}: ${Q[q ?? 0] || 'Común'}","${icon}","${name.replace(/"/g,'""')}","${(profs || []).map(i => etiquetas[i] || '').join(', ')}"`)
  ].join('\n');
  try { await navigator.clipboard.writeText(csv); }
  catch {
    const ta = Object.assign(document.createElement('textarea'), { value: csv });
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
  }
  showToast('¡Copiado al portapapeles!');
}

tabsContainer.addEventListener('click',e=>{const btn=e.target.closest('[data-tab-id]');if(btn)selectTab(btn.dataset.tabId);});
$('view-modes').addEventListener('click',e=>{const btn=e.target.closest('[data-mode]');if(btn)setViewMode(btn.dataset.mode);});
$('toggle-stack').addEventListener('change',e=>container.classList.toggle('hide-stack',!e.target.checked));
$('toggle-coords').addEventListener('change',e=>container.classList.toggle('hide-coords',!e.target.checked));
profFilter.addEventListener('change',applyFilters);
searchInput.addEventListener('input',applyFilters);
$('btn-clear').addEventListener('click',()=>{searchInput.value='';applyFilters();searchInput.focus();});
$('btn-export').addEventListener('click',copyData);

init();
</script>
</body>
</html>
