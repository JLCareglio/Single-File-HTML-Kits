a.innerHTML=`<div class="wow-icon-frame q-${q}"><img src="https://wow.zamimg.com/images/wow/icons/large/${icon}.jpg" alt="${name}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://wow.zamimg.com/images/wow/icons/large/inv_misc_questionmark.jpg'"><span class="coord-badge">[${r}:${c}]</span><span class="stack-badge">${stack}</span></div><div class="item-details min-w-0 flex-1"><div class="text-[11px] font-semibold leading-tight break-words q-${q}">${name}</div><div class="bot-meta hidden mt-1.5 space-y-1"><div class="flex items-center gap-1.5 text-[10px] font-mono text-amber-300/90"><span>ID:${id}</span></div><div class="flex flex-wrap gap-1">${profNames.map(p=>`<span class="inline-block px-1.5 py-0.5 bg-slate-800/90 text-slate-300 border border-slate-700 rounded text-[9px] leading-tight">${p}</span>`).join('')}</div></div></div>`;
frag.appendChild(a);
return{el:a,profs:profNames,search:norm(`${name} ${id}`)};
});
grid.appendChild(frag);
window.$WowheadPower?.refreshLinks?.();
}

function setViewMode(mode){
document.querySelectorAll('.view-btn').forEach(b=>{
const on=b.dataset.mode===mode;
b.classList.toggle('bg-amber-500',on);
b.classList.toggle('text-slate-950',on);
b.classList.toggle('hover:bg-amber-400',on);
b.classList.toggle('bg-slate-800',!on);
b.classList.toggle('text-slate-300',!on);
b.classList.toggle('hover:bg-slate-700',!on);
b.classList.toggle('hover:text-white',!on);
});
container.classList.toggle('mode-ingame',mode==='ingame');
const isBot=mode==='bot';
exportBox.classList.toggle('hidden',!isBot);
exportBox.classList.toggle('flex',isBot);
grid.querySelectorAll('.bot-meta').forEach(el=>el.classList.toggle('hidden',!isBot));
}

function applyFilters(){
const prof=profFilter.value,q=norm(searchInput.value.trim()),hasFilter=prof!=='ALL'||q!=='';
for(let i=0;i<slotNodes.length;i++){
const{el,profs,search}=slotNodes[i],match=(prof==='ALL'||profs.includes(prof))&&(q===''||search.includes(q));
el.classList.toggle('slot-dimmed',!match);
el.classList.toggle('ring-1',match&&hasFilter);
el.classList.toggle('ring-amber-400/70',match&&hasFilter);
}
}

function showToast(msg){
toastMsg.textContent=msg;
toast.classList.remove('hidden');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>toast.classList.add('hidden'),2500);
}

async function copyData(){
const csv=[
'Fila y Columna,ItemID,MaxStack,Nombre,Profesiones Relacionadas',
...RAW.map(([r,c,id,name,,stack,,profs])=>`"F${r}:C${String(c).padStart(2,'0')}",${id},${stack},"${name.replace(/"/g,'""')}","${profs.map(i=>P[i]).join(', ')}"`)
].join('\n');
try{
await navigator.clipboard.writeText(csv);
}catch{
const ta=Object.assign(document.createElement('textarea'),{value:csv});
document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
}
showToast('¡Copiado al portapapeles!');
}

$('view-modes').addEventListener('click',e=>{const btn=e.target.closest('[data-mode]');if(btn)setViewMode(btn.dataset.mode)});
$('toggle-stack').addEventListener('change',e=>container.classList.toggle('hide-stack',!e.target.checked));
$('toggle-coords').addEventListener('change',e=>container.classList.toggle('hide-coords',!e.target.checked));
profFilter.addEventListener('change',applyFilters);
searchInput.addEventListener('input',applyFilters);
$('btn-clear').addEventListener('click',()=>{searchInput.value='';applyFilters();searchInput.focus()});
$('btn-export').addEventListener('click',copyData);

renderBank();
</script>
</body>
</html>
