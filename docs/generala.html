const DEFAULT_STATE={players:[],scores:{},settings:{doblePareja:false,tercia:false,generalaServida:true,generalaReal:false,dobleGenerala:true,darkMode:true,shouldPlayWinnerAudio:true},isGameOver:false,winnerId:null,currentPlayerId:null};

function initTouchTapSupport(){
const TAP_THRESHOLD=12,activePointers=new Map();
let suppressNativeClick=false,suppressTimer=null;

const armClickSuppression=()=>{
suppressNativeClick=true;
clearTimeout(suppressTimer);
suppressTimer=setTimeout(()=>{suppressNativeClick=false},500);
};

const runClickableAction=clickable=>{
if(!clickable)return;
const onclickAttr=clickable.getAttribute?.("onclick");
if(onclickAttr){
new Function("event",onclickAttr).call(clickable,new MouseEvent("click",{bubbles:true,cancelable:true,view:window}));
return;
}
clickable.click?.();
};

document.addEventListener("click",e=>{
if(suppressNativeClick&&e.isTrusted){
suppressNativeClick=false;
clearTimeout(suppressTimer);
e.stopImmediatePropagation();
e.preventDefault();
}
},true);

document.addEventListener("pointerdown",e=>{
if(e.pointerType!=="touch"||!e.isPrimary)return;
const target=e.target instanceof Element?e.target:e.target?.parentElement;
if(!target||target.closest("input,textarea,select,label,[contenteditable='true']"))return;
activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY,moved:false,target});
},{passive:true,capture:true});

document.addEventListener("pointermove",e=>{
if(e.pointerType!=="touch")return;
const entry=activePointers.get(e.pointerId);
if(entry&&Math.hypot(e.clientX-entry.x,e.clientY-entry.y)>TAP_THRESHOLD)entry.moved=true;
},{passive:true,capture:true});

const finishTouchPointer=e=>{
if(e.pointerType!=="touch")return;
const entry=activePointers.get(e.pointerId);
activePointers.delete(e.pointerId);
if(!entry||entry.moved)return;
const clickable=entry.target?.closest("[onclick],button,[role='button']");
if(!clickable)return;
armClickSuppression();
runClickableAction(clickable);
};

document.addEventListener("pointerup",finishTouchPointer,{passive:true,capture:true});
document.addEventListener("pointercancel",e=>{activePointers.delete(e.pointerId)},{passive:true,capture:true});
}

function fadeOutWinnerAudio(){
if(!WINNERSOUND||WINNERSOUND.paused)return;
clearInterval(audioFadeInterval);
const steps=20,stepTime=20,volStep=WINNERSOUND.volume/steps;
audioFadeInterval=setInterval(()=>{
if(WINNERSOUND.volume>volStep){WINNERSOUND.volume-=volStep}
else{clearInterval(audioFadeInterval);WINNERSOUND.pause();WINNERSOUND.currentTime=0;WINNERSOUND.volume=1}
},stepTime);
}

function toggleAudio(isEnabled){state.settings.shouldPlayWinnerAudio=isEnabled;saveState()}

function toggleFullscreen(){
const fsEl=document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement||document.msFullscreenElement;
if(fsEl){
(document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen||document.msExitFullscreen)?.call(document);
}else{
const el=document.documentElement;
(el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen)?.call(el).catch(e=>console.warn("Fullscreen no disponible:",e));
}
}

function loadState(){
const saved=localStorage.getItem(STORAGE_KEY);
if(saved){
try{
const parsed=JSON.parse(saved);
const s={...DEFAULT_STATE.settings,...(parsed.settings||{})};
if(s.dobleGeneralaServida!==undefined&&parsed.settings?.generalaServida===undefined)s.generalaServida=s.dobleGeneralaServida;
delete s.dobleGeneralaServida;
state={...structuredClone(DEFAULT_STATE),...parsed,settings:s};
}catch{state=structuredClone(DEFAULT_STATE)}
}else{
state.settings.darkMode=Boolean(window.matchMedia?.("(prefers-color-scheme: dark)").matches);
}
applySettings();applyTheme();ensureCurrentPlayer();
if(!state.players.length){openSettings()}
else{renderGrid();if(state.isGameOver&&state.winnerId)handleVictory(state.winnerId,false)}
}

function ensureCurrentPlayer(){
if(!state.players.length){state.currentPlayerId=null;return}
if(!state.currentPlayerId||!state.players.some(p=>p.id===state.currentPlayerId))state.currentPlayerId=state.players[0].id;
}

function advanceTurn(){
if(!state.players.length){state.currentPlayerId=null;return}
const idx=state.players.findIndex(p=>p.id===state.currentPlayerId);
state.currentPlayerId=state.players[idx>=0?(idx+1)%state.players.length:0].id;
}

function applyTheme(){
document.documentElement.classList.toggle("dark",Boolean(state.settings.darkMode));
$("toggle-dark-mode").checked=Boolean(state.settings.darkMode);
}

function applySettings(){
for(const[catId,baseScore]of Object.entries(SERVIDA_CATS)){
const cat=CATEGORIES.find(c=>c.id===catId);
if(cat)cat.options=state.settings.generalaServida?[baseScore,"W"]:[baseScore];
}
}

function toggleTheme(isDark){state.settings.darkMode=isDark;applyTheme();saveState()}

function toggleCategorySetting(settingKey,scoreKey,isEnabled){
state.settings[settingKey]=isEnabled;
if(!isEnabled){for(const pid in state.scores)delete state.scores[pid]?.[scoreKey]}
saveState();renderGrid();
}

const toggleDoblePar=v=>toggleCategorySetting("doblePareja","doblepareja",v);
const toggleTercia=v=>toggleCategorySetting("tercia","tercia",v);
const toggleGeneralaReal=v=>toggleCategorySetting("generalaReal","generalareal",v);
const toggleDobleGenerala=v=>toggleCategorySetting("dobleGenerala","doblegenerala",v);

function toggleGeneralaServida(isEnabled){
state.settings.generalaServida=isEnabled;
applySettings();
if(!isEnabled){
for(const pid in state.scores){
const pScores=state.scores[pid];
if(!pScores)continue;
for(const catId of SERVIDA_IDS){if(pScores[catId]==="W")delete pScores[catId]}
}
}
saveState();renderGrid();
}

function openSettings(){
$("toggle-doble-pareja").checked=state.settings.doblePareja;
$("toggle-tercia").checked=state.settings.tercia;
$("toggle-generala-servida").checked=state.settings.generalaServida;
$("toggle-generala-real").checked=state.settings.generalaReal;
$("toggle-doble-generala").checked=state.settings.dobleGenerala;
$("toggle-audio").checked=state.settings.shouldPlayWinnerAudio;
renderPlayersList();
$("settings-modal").classList.remove("hidden");
updateSettingsButtonsState();
}

function closeSettings(){
$("settings-modal").classList.add("hidden");
if(!state.players.length){openSettings();$("add-player-btn")?.focus()}
else{renderGrid()}
}

function renderPlayersList(){
const list=$("players-list");
if(!state.players.length){
list.innerHTML='<p class="font-medium text-center py-4">No hay jugadores.<br><br>Para jugar necesitas al menos uno.<br><br>Pulsa el botón verde que está arriba para<br>agregar jugadores.</p>';
updateSettingsButtonsState();
return;
}
list.innerHTML=state.players.map((p,i)=>`
<div class="flex items-center bg-gray-100 dark:bg-[#2a2a2a] rounded-lg overflow-hidden">
<button type="button" onclick="editPlayer('${p.id}')" class="flex-1 flex items-center justify-between gap-3 px-4 py-2 text-left text-gray-700 dark:text-gray-200 rounded-lg hover:bg-blue-500 hover:text-white transition">
<div class="flex items-center gap-3"><span class="text-2xl">${p.emoji}</span><span class="font-medium text-sm">${escapeHtml(getPlayerDisplayName(p,i))}</span></div>
<span class="material-symbols-outlined text-lg font-medium">edit</span>
</button>
<div class="flex items-center">
<button type="button" onclick="event.stopPropagation();movePlayer(${i},-1)" class="py-2 px-3 text-gray-500 hover:text-white hover:bg-gray-600 rounded transition"><span class="material-symbols-outlined text-lg font-bold">arrow_upward</span></button>
<button type="button" onclick="event.stopPropagation();movePlayer(${i},1)" class="py-2 px-3 text-gray-500 hover:text-white hover:bg-gray-600 rounded transition"><span class="material-symbols-outlined text-lg font-bold">arrow_downward</span></button>
<button type="button" onclick="event.stopPropagation();removePlayer('${p.id}')" class="py-2 px-3 text-red-500 hover:bg-red-500/20 rounded transition"><span class="material-symbols-outlined text-xl font-medium">delete</span></button>
</div>
</div>`).join("");
updateSettingsButtonsState();
}

function movePlayer(index,dir){
const target=index+dir;
if(target<0||target>=state.players.length)return;
[state.players[index],state.players[target]]=[state.players[target],state.players[index]];
saveState();renderPlayersList();
}

function removePlayer(id){
state.players=state.players.filter(p=>p.id!==id);
delete state.scores[id];
ensureCurrentPlayer();
saveState();renderPlayersList();
}

function editPlayer(id){
const player=state.players.find(p=>p.id===id);
if(player)openPlayerEditor(player.id,player.emoji,player.name);
}

function renderPlayerEditorGrid(){
const grid=$("emoji-grid");
const selectedEmoji=editingPlayerDraft.emoji||getRandomEmoji();
const frag=document.createDocumentFragment();
let activeBtn=null;

for(const emoji of EMOJIS){
const btn=document.createElement("button");
btn.type="button";
btn.className="text-3xl p-2 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-lg transition transform active:scale-95";
btn.textContent=emoji;
if(emoji===selectedEmoji){btn.classList.add("ring-2","ring-blue-500");activeBtn=btn}
btn.onclick=()=>{editingPlayerDraft.emoji=emoji;renderPlayerEditorGrid()};
frag.appendChild(btn);
}
grid.replaceChildren(frag);
if(activeBtn)requestAnimationFrame(()=>activeBtn.scrollIntoView({block:"center",behavior:"smooth"}));
}

function openPlayerEditor(playerId=null,selectedEmoji=null,initialName=""){
editingPlayerId=playerId;
editingPlayerDraft={emoji:selectedEmoji||getRandomEmoji(),name:initialName||""};
const nameInput=$("player-name-input");
nameInput.value=editingPlayerDraft.name;
renderPlayerEditorGrid();
$("emoji-modal").classList.remove("hidden");

$("accept-player-editor-btn").onclick=()=>{
const draftName=nameInput.value.trim();
const resolvedEmoji=editingPlayerDraft.emoji||getRandomEmoji();
if(editingPlayerId){
const player=state.players.find(p=>p.id===editingPlayerId);
if(player){player.emoji=resolvedEmoji;player.name=draftName;saveState();renderPlayersList();renderGrid()}
}else{addPlayer(resolvedEmoji,draftName)}
closePlayerEditor();
};

requestAnimationFrame(()=>{nameInput.focus();nameInput.select()});
}

function closePlayerEditor(){
$("emoji-modal").classList.add("hidden");
editingPlayerId=null;
editingPlayerDraft={emoji:null,name:""};
}

function addPlayer(emoji,name=""){
const id=`p_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
state.players.push({id,emoji,name:name?.trim()||""});
state.scores[id]??={};
ensureCurrentPlayer();
saveState();renderPlayersList();renderGrid();
}

const addRandomPlayer=()=>addPlayer(getRandomEmoji(),"");
const hasAnyRecordedScore=()=>state.players.some(p=>Object.keys(state.scores[p.id]||{}).length>0);

function restartIfAllowed(){
if(!state.players.length||!hasAnyRecordedScore()){openSettings();renderPlayersList();$("add-player-btn")?.focus();return}
restartGame();closeSettings();
}

function updateSettingsButtonsState(){
const resetBtn=$("reset-btn"),continueBtn=$("continue-btn"),settingsBtn=$("settings-button");
const hasPlayers=state.players.length>0,hasScores=hasAnyRecordedScore();
if(resetBtn){
const active=hasPlayers&&hasScores;
resetBtn.disabled=!active;
resetBtn.className=active?"flex-1 flex justify-center gap-2 bg-red-600 dark:bg-red-700 hover:bg-red-700 dark:hover:bg-red-600 text-white p-3 rounded-lg font-medium transition":"flex-1 flex justify-center gap-2 bg-gray-300 dark:bg-gray-700 text-gray-500 p-3 rounded-lg font-medium transition cursor-not-allowed";
}
if(continueBtn){
continueBtn.disabled=!hasPlayers;
continueBtn.className=hasPlayers?"flex-1 flex justify-center gap-2 bg-green-600 dark:bg-green-700 hover:bg-green-700 dark:hover:bg-green-600 text-white p-3 rounded-lg font-medium transition":"flex-1 flex justify-center gap-2 bg-gray-300 dark:bg-gray-700 text-gray-500 p-3 rounded-lg font-medium transition cursor-not-allowed";
}
settingsBtn?.classList.toggle("text-gray-400",!hasPlayers);
}

function restartGame(){
for(const pid in state.scores)state.scores[pid]={};
state.isGameOver=false;state.winnerId=null;
state.currentPlayerId=state.players[0]?.id||null;
saveState();closeVictoryModal();renderGrid();
}

const calculateTotal=playerId=>Object.values(state.scores[playerId]||{}).reduce((sum,v)=>typeof v==="number"?sum+v:sum,0);
const hasServidaWin=playerId=>SERVIDA_IDS.some(catId=>state.scores[playerId]?.[catId]==="W");

const getActiveCategories=()=>CATEGORIES.filter(cat=>cat.settingKey?Boolean(state.settings[cat.settingKey]):true);
const isCategoryAvailableForPlayer=(playerId,catId)=>Boolean(playerId&&catId&&state.scores[playerId]?.[catId]===undefined);

function openCategoryForCurrentPlayer(catId){
if(state.currentPlayerId&&!state.isGameOver)openScoreModal(state.currentPlayerId,catId);
}

function renderGrid(){
const gridContainer=$("game-grid");
const activeCats=getActiveCategories();
gridContainer.style.gridTemplateColumns=`64px repeat(${state.players.length},minmax(64px,1fr))`;

const settingsDisabled=!state.players.length;
const settingsHeaderClass=settingsDisabled
?"sticky-corner bg-surface-light dark:bg-surface-dark flex items-center justify-center p-3 rounded-lg shadow-sm border border-gray-300 dark:border-gray-700 text-gray-400 cursor-pointer transition"
:"sticky-corner bg-surface-light dark:bg-surface-dark flex items-center justify-center p-3 rounded-lg shadow-sm border border-gray-300 dark:border-gray-700 cursor-pointer hover:bg-gray-200 dark:hover:bg-gray-700 transition";

let html=`<div id="settings-button" class="${settingsHeaderClass}" role="button" tabindex="0" onclick="openSettings()"><span class="material-symbols-outlined ${settingsDisabled?"text-gray-400":"text-gray-600 dark:text-gray-300"} text-3xl">settings</span></div>`;

for(const p of state.players){
const isCurrent=p.id===state.currentPlayerId;
html+=`<div class="sticky-header bg-surface-light dark:bg-surface-dark flex items-center justify-center p-3 rounded-lg shadow-sm border border-gray-300 dark:border-gray-700 cursor-pointer ${isCurrent?"current-player-header":""}" role="button" tabindex="0" onclick="event.stopPropagation();editPlayer('${p.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();editPlayer('${p.id}')}"><span class="text-3xl">${p.emoji}</span>${isCurrent?'<span class="absolute top-1 right-2 text-sm text-blue-600 dark:text-blue-400">●</span>':""}</div>`;
}

for(const cat of activeCats){
const isPlayable=Boolean(state.currentPlayerId)&&isCategoryAvailableForPlayer(state.currentPlayerId,cat.id);
const catStyle=isPlayable?' style="background-image:linear-gradient(135deg,rgba(96,165,250,.18),rgba(59,130,246,.06))"':"";
const catClass=`sticky-col bg-surface-light dark:bg-surface-dark flex items-center justify-center p-2 rounded-lg shadow-sm border border-gray-300 dark:border-gray-700 no-select cursor-pointer transition ${isPlayable?"hover:bg-blue-100 dark:hover:bg-blue-900":"hover:bg-gray-200 dark:hover:bg-gray-700"}`;
html+=`<div class="${catClass}"${catStyle} onclick="openCategoryForCurrentPlayer('${cat.id}')"><span class="text-lg font-bold text-gray-700 dark:text-gray-300">${cat.label}</span>${isPlayable?'<span class="absolute top-1 right-2 text-sm text-blue-600 dark:text-blue-400">●</span>':""}</div>`;

for(const p of state.players){
const score=state.scores[p.id]?.[cat.id];
const isCurrent=p.id===state.currentPlayerId;
let cellClass=`relative bg-cell-light dark:bg-cell-dark text-gray-800 dark:text-gray-200 border border-gray-300 dark:border-gray-700 hover:opacity-80 transition cursor-pointer flex items-center justify-center rounded-lg shadow-sm font-bold text-lg ${isCurrent?"current-player-cell":""}`;
let displayScore="-";

if(score!==undefined){
if(score==="T"){displayScore="/";cellClass="relative bg-red-600 dark:bg-red-700 hover:bg-red-700 dark:hover:bg-red-600 text-white border-red-700 dark:border-red-800 cursor-pointer flex items-center justify-center rounded-lg shadow-sm font-bold text-lg"}
else if(score==="W"){displayScore="GANÓ";cellClass="relative bg-yellow-500 dark:bg-yellow-600 text-black border-yellow-600 cursor-pointer flex items-center justify-center rounded-lg shadow-sm font-bold text-lg"}
else{displayScore=score;cellClass="relative bg-green-600 dark:bg-green-700 hover:bg-green-700 dark:hover:bg-green-600 text-white border-green-700 dark:border-green-800 cursor-pointer flex items-center justify-center rounded-lg shadow-sm font-bold text-lg"}
}
html+=`<div class="${cellClass} no-select" onclick="openScoreModal('${p.id}','${cat.id}')">${displayScore}</div>`;
}
}

html+=`<div class="sticky-col bg-surface-light dark:bg-surface-dark flex items-center justify-center p-3 rounded-lg shadow-sm border border-gray-300 dark:border-gray-700 mt-2"><span class="text-lg font-bold text-gray-800 dark:text-gray-100">Total</span></div>`;
for(const p of state.players){
const isCurrent=p.id===state.currentPlayerId;
html+=`<div class="bg-surface-light dark:bg-surface-dark flex items-center justify-center p-3 rounded-lg shadow-sm border border-gray-300 dark:border-gray-700 mt-2 ${isCurrent?"current-player-cell":""}"><span class="text-lg font-bold text-gray-800 dark:text-gray-100">${calculateTotal(p.id)}</span></div>`;
}

gridContainer.innerHTML=html;
updateSettingsButtonsState();
}

function openScoreModal(playerId,catId){
if(state.isGameOver)return;
state.currentPlayerId=playerId;
saveState();
currentEditing={playerId,catId};

const player=state.players.find(p=>p.id===playerId);
const cat=CATEGORIES.find(c=>c.id===catId);
state.scores[playerId]??={};
const currentScore=state.scores[playerId][catId];

$("score-modal-title").innerHTML=`<span class="text-2xl align-middle mx-1">${player.emoji}</span> ${cat.fullLabel}`;

const options=[{label:"TACHA",value:"T"}];
if(cat.type==="num"){
for(let i=1;i<=5;i++){const val=cat.mult*i;options.push({label:String(val),value:val})}
}else if(cat.type==="fixed"){
for(const opt of cat.options)options.push({label:opt==="W"?"SERVIDA (GANA)":String(opt),value:opt});
}

const optionsContainer=$("score-options");
const frag=document.createDocumentFragment();
for(const opt of options){
const btn=document.createElement("button");
btn.type="button";
btn.className="w-full py-3 text-lg text-blue-500 hover:bg-blue-500/20 hover:bg-gray-100 dark:hover:bg-gray-800 transition rounded-lg font-bold";
btn.textContent=opt.label;
btn.onclick=()=>submitScore(opt.value);
frag.appendChild(btn);
}
optionsContainer.replaceChildren(frag);
$("btn-delete-score").classList.toggle("hidden",currentScore===undefined);
$("score-modal").classList.remove("hidden");
}

function closeScoreModal(){$("score-modal").classList.add("hidden");currentEditing={playerId:null,catId:null}}

function deleteCurrentScore(){
const{playerId,catId}=currentEditing;
if(playerId&&catId){delete state.scores[playerId]?.[catId];saveState();renderGrid();closeScoreModal()}
}

function submitScore(value){
const{playerId,catId}=currentEditing;
state.scores[playerId]??={};
state.scores[playerId][catId]=value;
advanceTurn();saveState();closeScoreModal();renderGrid();
setTimeout(checkWinCondition,100);
}

function checkWinCondition(){
for(const pid in state.scores){
if(hasServidaWin(pid)){handleVictory(pid);return}
}
const activeCats=getActiveCategories();
if(!state.players.length||!activeCats.length)return;

const allFull=state.players.every(p=>{
const pScores=state.scores[p.id]||{};
return activeCats.every(cat=>pScores[cat.id]!==undefined);
});

if(allFull){
let highest=-1,winnerId=null;
for(const p of state.players){
const total=calculateTotal(p.id);
if(total>highest){highest=total;winnerId=p.id}
}
if(winnerId)handleVictory(winnerId);
}
}

function handleVictory(winnerId,playAudio=true){
state.isGameOver=true;state.winnerId=winnerId;saveState();
const winner=state.players.find(p=>p.id===winnerId);
if(!winner)return;

$("victory-emoji").textContent=winner.emoji;
$("victory-score").textContent=hasServidaWin(winnerId)?"¡Generala Servida!":`${calculateTotal(winnerId)} pts`;

if(playAudio&&state.settings.shouldPlayWinnerAudio){
clearInterval(audioFadeInterval);
WINNERSOUND.volume=1;WINNERSOUND.currentTime=0;
WINNERSOUND.play().catch(err=>console.log("Audio bloqueado por el navegador:",err));
}

const rankingContainer=$("victory-ranking");
const rankings=state.players.map((p,i)=>({
emoji:p.emoji,id:p.id,name:getPlayerDisplayName(p,i),
total:calculateTotal(p.id),isWinner:p.id===winnerId,servida:hasServidaWin(p.id)
})).sort((a,b)=>(b.servida-a.servida)||(b.total-a.total));

if(rankings.length<=1){
rankingContainer.innerHTML='<div class="text-center text-gray-500 py-2">Sin oponentes</div>';
}else{
rankingContainer.innerHTML=rankings.map((r,i)=>`
<div class="flex justify-between items-center p-2 rounded min-w-0 ${r.isWinner?"bg-yellow-100 dark:bg-yellow-900/30 border border-yellow-400/40":"bg-white dark:bg-gray-800"}">
<span class="text-gray-600 dark:text-gray-300 min-w-0 truncate flex items-center gap-2"><span class="font-semibold">${i+1}º</span><span class="text-xl">${r.emoji}</span><span class="font-medium text-gray-800 dark:text-gray-200">${escapeHtml(r.name)}</span></span>
<span class="font-bold text-gray-800 dark:text-gray-200 min-w-0 truncate text-right">${r.servida?"Servida":r.total}</span>
</div>`).join("");
}

$("victory-modal").classList.remove("hidden");
}

function closeVictoryModal(){$("victory-modal").classList.add("hidden");fadeOutWinnerAudio()}
const closeVictoryAndViewBoard=()=>closeVictoryModal();

initTouchTapSupport();
window.addEventListener("DOMContentLoaded",loadState);
</script>
</body>
</html>
